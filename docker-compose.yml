services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 3

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level info
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      DOWNLOAD_DIR: /app/downloads
      AUTH_MODE: cookies
      COOKIES_FILE: /app/cookies.txt
      YTDLP_CACHE_DIR: /app/.ytdlp_cache
      FILE_TTL_SECONDS: "3600"
      CLEANUP_INTERVAL_SECONDS: "300"
      MAX_CONCURRENT_DOWNLOADS: "3"
      RESOLVE_TIMEOUT_SECONDS: "30"
      DOWNLOAD_TIMEOUT_SECONDS: "600"
    volumes:
      - download_data:/app/downloads
      - ytdlp_cache:/app/.ytdlp_cache
      - ./cookies.txt:/app/cookies.txt
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: python -m app.worker
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      DOWNLOAD_DIR: /app/downloads
      AUTH_MODE: cookies
      COOKIES_FILE: /app/cookies.txt
      YTDLP_CACHE_DIR: /app/.ytdlp_cache
      MAX_CONCURRENT_DOWNLOADS: "3"
      WORKER_MAX_RETRIES: "3"
      WORKER_RETRY_DELAY_SECONDS: "5"
      DOWNLOAD_TIMEOUT_SECONDS: "600"
    volumes:
      - download_data:/app/downloads
      - ytdlp_cache:/app/.ytdlp_cache
      - ./cookies.txt:/app/cookies.txt
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  redis_data:
  download_data:
  ytdlp_cache:
