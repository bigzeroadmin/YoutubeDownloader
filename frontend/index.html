<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Downloader</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>YouTube Downloader</h1>
      <p class="subtitle">私有部署 · 粘贴链接即可下载</p>
    </header>

    <section class="input-section">
      <div class="url-bar">
        <input
          id="urlInput"
          type="url"
          placeholder="粘贴 YouTube 视频链接..."
          autocomplete="off"
        />
        <button id="resolveBtn" onclick="handleResolve()">解析</button>
      </div>
      <p id="errorMsg" class="error hidden"></p>
    </section>

    <section id="videoInfo" class="video-info hidden">
      <div class="video-meta">
        <img id="thumbnail" alt="thumbnail" />
        <div>
          <h2 id="videoTitle"></h2>
          <span id="videoDuration" class="badge"></span>
        </div>
      </div>

      <div class="format-section">
        <h3>选择格式</h3>
        <div class="format-tabs">
          <button class="tab active" data-tab="video" onclick="switchTab('video')">视频</button>
          <button class="tab" data-tab="audio" onclick="switchTab('audio')">音频</button>
        </div>
        <div id="formatList" class="format-list"></div>
      </div>
    </section>

    <section id="queueSection" class="queue-section hidden">
      <h3>下载队列</h3>
      <div id="queueList" class="queue-list"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
